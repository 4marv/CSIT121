<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact & Feedback</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav>
        <a href="tierlist.html">Tier List</a>
        <a href="contact.html">Contact Me Here!</a>
    </nav>

    <h1>Overwatch Tier List Feedback</h1>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="favorite">Favorite Support Hero:</label>
        <select id="favorite" name="favorite">
            <option>Kiriko</option>
            <option>Ana</option>
            <option>Mercy</option>
            <option>Lucio</option>
            <option>Baptiste</option>
            <option>Juno</option>
            <option>Zenyatta</option>
        </select>

        <p>Do you agree with the rankings?</p>
        <label><input type="radio" name="agree" value="yes"> Yes</label>
        <label><input type="radio" name="agree" value="no"> No</label>

        <p>What do you value most in a support?</p>
        <label><input type="checkbox" name="playstyle" value="healing"> Healing</label>
        <label><input type="checkbox" name="playstyle" value="damage"> Damage</label>
        <label><input type="checkbox" name="playstyle" value="utility"> Utility</label>

        <label for="comments">Your thoughts on my rankings:</label>
        <textarea id="comments" name="comments"></textarea>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
